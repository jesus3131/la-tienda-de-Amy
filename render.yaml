services:
  - type: web
    name: erp-pos-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_CA
        sync: false
