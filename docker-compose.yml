version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: erp_pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000_init.sql:/docker-entrypoint-initdb.d/000_init.sql
    networks:
      - erp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/erp_pos
      JWT_SECRET: ${LOCAL_JWT_SECRET:?Set LOCAL_JWT_SECRET in the environment before starting the local stack}
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: development
      NODE_ROLE: local
      NODE_ID: local-primary
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGINS: ${LOCAL_FRONTEND_ORIGINS:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-net

  redis:
    image: redis:7-alpine
    container_name: erp-pos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - erp-net

volumes:
  pgdata:

networks:
  erp-net:
    driver: bridge
