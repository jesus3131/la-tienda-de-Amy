name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_dev_password
          POSTGRES_DB: erp_pos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd backend && npm ci
      - run: cd backend && npx tsc -p tsconfig.json
      - run: cd backend && npm run migrate
        env:
          DATABASE_URL: ******localhost:5432/erp_pos
          NODE_ENV: test
          JWT_SECRET: test-secret-at-least-32-chars-long
      - run: cd backend && npm test
        env:
          DATABASE_URL: postgresql://erp:erp_dev_password@localhost:5432/erp_pos
          NODE_ENV: test
          JWT_SECRET: test-secret-at-least-32-chars-long
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build